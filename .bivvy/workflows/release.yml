description: "Tag and push a release (replaces bin/release)"

steps:
  version-bump:
    template: rust/version-bump
    depends_on: [release-preflight]

  version-commit:
    title: "Commit version bump"
    depends_on: [version-bump]
    check:
      type: execution
      command: "git diff --quiet Cargo.toml && git diff --quiet Cargo.lock"
      validation: success
    command: |
      VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
      git add Cargo.toml Cargo.lock
      git diff --cached --quiet || git commit -m "Bump version to $${VERSION}"

  release-preflight:
    title: "Release preflight"
    depends_on: [ci-test, build]
    precondition:
      type: all
      checks:
        - type: execution
          command: "test $(git branch --show-current) = main"
          validation: success
        - type: execution
          command: "git diff --quiet && git diff --cached --quiet"
          validation: success
    command: |
      VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
      echo "Ready to release $${VERSION}"

  release-tag:
    title: "Tag and push release"
    depends_on: [version-commit]
    precondition:
      type: all
      checks:
        - type: execution
          command: "git diff --quiet && git diff --cached --quiet"
          validation: success
        - type: execution
          command: "! git rev-parse --verify --quiet \"refs/tags/$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = \"\\(.*\\)\"/\\1/')\" >/dev/null"
          validation: success
    command: |
      VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
      git tag "$${VERSION}" && git push origin main && git push origin "$${VERSION}"

workflow:
  force_all: true
  steps:
    - rust
    - clippy
    - rustfmt
    - cargo-edit
    - deps
    - build
    - lint
    - test
    - ci-test
    - release-preflight
    - version-bump
    - version-commit
    - release-tag
