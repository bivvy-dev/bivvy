name: Publish Packages

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag name for the release'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.toml version matches tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          TAG_VERSION="${TAG#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Cargo.toml version ($VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Cargo.toml version $VERSION matches tag $TAG_VERSION"

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-gem:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Set version from tag
        env:
          TAG: ${{ inputs.tag }}
        run: echo "$TAG" > dist/gem/VERSION
      - run: |
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":rubygems_api_key: ${RUBYGEMS_API_KEY}" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          cd dist/gem
          gem build bivvy.gemspec
          gem push bivvy-*.gem
          rm -f ~/.gem/credentials
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  publish-pip:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set version from tag
        env:
          TAG: ${{ inputs.tag }}
        run: sed -i "s/^version = \".*\"/version = \"$TAG\"/" dist/pip/pyproject.toml
      - run: |
          pip install build twine
          cd dist/pip
          python -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
